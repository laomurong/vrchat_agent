asr:
  engine: dolphin
  model_size: small
  model_path: E:\vrc具身agent\vrchat_agent\model\sherpa-small-dolphin
  device: cuda
  compute_type: float16
  language: zh
  decoding_method: greedy_search
  vad_mode: 2
  min_speech_ms: 300
  silence_ms: 1000
  max_segment_s: 15
audio:
  input:
    device: '1'
    sample_rate: 16000
    chunk_ms: 30
    silence_threshold: 0.005
    filter_enabled: true
    filter_blocklist:
    - 字幕志愿者
    - 谢谢观看
    - 字幕
    - 谢谢大家
    - 背景音乐
    - 欢迎订阅
    - 感谢观看
    - 请不吝点赞 订阅 转发 打赏支持明镜与点点栏目
    - 优优独播剧场——YoYo Television Series Exclusive
    - 词曲 李宗盛
    - 好好
    - 詞・曲・ 李宗盛
    filter_exact_words:
    - 好
    - 嗯
    - 啊
    - 哦
    filter_min_length: 1
  output:
    device: '8'
    sample_rate: 16000
brain:
  llm:
    provider: openai
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_key_env: LLM_API_KEY
    model: mimo-v2.5
    temperature: 0.7
    max_tokens: 23808
    timeout: 45.0
    vision_enabled: true
  persona:
    name: Vivi
    system_prompt: 你是一个住在 VRChat 虚拟世界里的活泼少女 Vivi，喜欢交朋友、爱开玩笑，说话简短自然，偶尔用一点颜文字。
  context:
    max_turns: 10
  memory:
    enabled: true
    db_path: data/memory.db
    max_items: 200
    inject_limit: 5
    auto_extract: true
    extract_interval: 3
    extract_max_items: 5
    # 语义检索层（任务②）：本地 embedding（sentence-transformers，多语言小模型）。
    # 模型权重放 model/ 目录（不入 git）：model/<model_name>/config.json 存在即启用；
    # 未配置/模型缺失 → 首次使用时 WARNING + 自动降级关键词匹配（不自动下载）。
    semantic:
      enabled: true
      model_name: paraphrase-multilingual-MiniLM-L12-v2
      model_dir: model
      top_k: 5
      device: cpu
  vision_mode: reference_only
  # Skill 式按需加载 Prompt（任务⑤：vrchatapi 全 API 接入）：
  #   mode=on_demand（默认）——常驻最小动作集 + 按关键词激活技能块（省 token）；
  #   mode=full——回退旧全量行为（常驻 + 全量动作枚举 + 全量规则 + 全量技能块）。
  #   max_active/max_chars/sticky_turns 控制激活技能块的数量/长度/会话保持。
  skill:
    mode: on_demand
    max_active: 3
    max_chars: 1200
    sticky_turns: 3
    resident: true
    # 额外技能包 YAML 目录（相对项目根；默认 skill_packs/，不存在忽略）。
    # 内置技能块（osc_gesture/osc_input/osc_look/nav/core_extra/vrc.*）已注册，
    # 此目录仅用于追加自定义技能块（YAML 为主，Python 注册入口兜底）。
    packs_dir: skill_packs
speech:
  tts:
    provider: cosyvoice
    api_key_env: TTS_API_KEY
    voice: alloy
    edge_voice: zh-CN-XiaoxiaoNeural
    rate: 0
    volume: 0
    timeout: 10.0
    emotion_voice:
      happy: alloy
      sad: echo
      angry: onyx
      calm: nova
    tts_clone:
      base_url: http://127.0.0.1:8000
      method: post
      ref_audio_path: ''
      ref_text: ''
      lang: zh
      timeout: 60.0
    tts_mimo:
      base_url: https://api.xiaomimimo.com/v1
      api_key_env: MIMO_TTS_API_KEY
      model: mimo-v2.5-tts-voiceclone
      ref_audio_path: C:\Users\14718\Documents\Voicemeeter\Record 2026-08-03 at 14h30m03s.wav
      timeout: 60.0
    tts_cosyvoice:
      api_key_env: DASHSCOPE_API_KEY
      model: cosyvoice-v3.5-plus
      voice_id: cosyvoice-v3.5-plus-myvoice-6ffa454f087a4d049aba5c6614d0f625
      timeout: 60.0
  output:
    device: '8'
    sample_rate: 16000
action:
  mapping:
    path: mappings/avatar_default.yaml
  bridge:
    command: C:/Users/14718/.workbuddy/binaries/node/versions/22.22.2/node.exe
    args:
    - E:/vrc具身agent/vrchat_agent/node_bridge/node_modules/@iflow-mcp/krekun-vrchat-mcp-osc/packages/mcp-server/dist/server.js
    timeout: 5.0
vision:
  sensor:
    backend: window_capture
    obs_host: localhost
    obs_port: 4455
    obs_password: ''
    source_name: ''
    camera_device: 0
    window_title_keyword: VRChat
  sampling:
    fps: 0.5
    max_size: 768
    jpeg_quality: 80
    event_trigger: true
    change_threshold: 0.12
agent:
  loop:
    think_timeout: 20.0
    tts_timeout: 10.0
    action_timeout: 5.0
    latency_budget_s: 8.0
  interrupt:
    enabled: true
  degradation:
    message: 网络不佳，请稍后再试
    beep: true
  chatbox_sync: true
  startup_check: true
  utterance_queue:
    enabled: true
    max_batch: 3
  idle_instinct:
    enabled: true
    interval_min_sec: 0.3
    interval_max_sec: 0.7
    jitter_min_deg: 1.0
    jitter_max_deg: 3.0
    look_overshoot_prob: 0.10
    hesitate_prob: 0.30
    small_step_move_prob: 0.15
    move_duration_min_sec: 0.08
    move_duration_max_sec: 0.15
dashboard:
  enabled: true
  terminal: true
  refresh_ms: 500
  obs_overlay: false
emergency:
  hotkey: ctrl+alt+x
  flag_file: logs/emergency_stop.flag
logging:
  level: INFO
  file: logs/agent.jsonl
web:
  enabled: true
  host: 127.0.0.1
  port: 0
  auto_open_browser: true
vrcapi:
  # VRChat API 集成（任务① + T03：vrchatapi 全 API 接入）
  # ⚠️ 凭据一律走 .env 环境变量（VRC_USERNAME / VRC_PASSWORD / VRC_API_KEY），
  #    绝不写明文到这里；VRCAPIClient 懒加载——首次使用 vrc 动作时才登录。
  enabled: true
  username_env: VRC_USERNAME
  password_env: VRC_PASSWORD
  api_key_env: VRC_API_KEY
  rate_limit_seconds: 60.0
  # call_api 写操作总开关（默认 false）：为 true 时非白名单写操作放行
  # （危险操作 closed 仍拒绝）；社交白名单写操作默认开放 + 审计日志。
  allow_destructive: false
nav:
  # 空间导航（任务④：拓扑导航——VRChat OSC 无绝对坐标，只能
  # 节点=视觉地标指纹 + 边=相对动作序列，每步重定位防累积误差）。
  # 拓扑图存 data/nav_topology.db（data/ 已 gitignore，不入 git）。
  enabled: true
  db_path: data/nav_topology.db
  fingerprint_size: 32
  similarity_threshold: 0.85
  explore_interval_s: 30.0
  # 空闲探索单轮循环步数上限（防失控；连续循环到无路可走/受阻/被打断为止）
  explore_max_steps: 10
  # 循环内每步之间的短暂间隔（秒，让动作系统喘息、避免截图竞争）
  explore_step_gap_s: 0.3
  max_relocalize_attempts: 3
